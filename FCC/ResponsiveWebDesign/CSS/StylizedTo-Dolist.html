<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="StylizedTo-Dolist.css" />
    <title>Stylized To-do list</title>
  </head>

  <body>
    <ul class="todo-list">
      <h1>My To-Do List</h1>
      <li>
        <input type="checkbox" id="list-item-first" />
        <label for="list-item-first"
          > Explore gaming keyboards</label
        >
        <ul class="sub-item">
          <li>
            <a
              href="https://niky.dev"
              class="sub-item-link"
              target="_blank"
              >Store link</a
            >
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="list-item-second" />
        <label for="list-item-second"> Finish the report</label>
        <ul class="sub-item">
          <li>
            <a
              href="https://niky.dev"
              class="sub-item-link"
              target="_blank"
              >Request Access</a
            >
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="list-item-third" />
        <label for="list-item-third"
          > View Phone's Warranty</label
        >
        <ul class="sub-item">
          <li>
            <a
              href="https://niky.dev"
              class="sub-item-link"
              target="_blank"
              >View Receipts</a
            >
          </li>
        </ul>
      </li>

      <li>
        <input type="checkbox" id="list-item-fourth" />
        <label for="list-item-fourth"
          > Check Processor Specs</label
        >
        <ul class="sub-item">
          <li>
            <a
              href="https://niky.dev"
              class="sub-item-link"
              target="_blank"
              >View Model Number</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </body>
</html>
