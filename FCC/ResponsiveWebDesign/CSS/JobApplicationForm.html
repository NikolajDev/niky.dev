<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="JobApplicationForm.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required> <label for="email">Email:</label>
            <input type="email" id="email" name="email" required> <label for="position">Position:</label>
            <select name="position" id="position" required>
                <option value="">Select a position</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability:</legend>
                <input type="radio" id="full-time" name="availability" value="full-time" checked>
                <label for="full-time" class="radio-label">Full-Time</label>

                <input type="radio" id="part-time" name="availability" value="part-time">
                <label for="part-time" class="radio-label">Part-Time</label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea name="why" id="message" rows="5" required></textarea> <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
